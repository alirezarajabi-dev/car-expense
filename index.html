<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Car Expense Log: daily odometer readings, parking receipts and month-end fuel price, exported as a printable PDF. Developed by Alex Rajabi · Bizkonic.">
<meta name="theme-color" content="#142c2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Expense">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Car Expense Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap">
<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* Layout: one phone column. Dark summary slab on top, then the month as a list of day rows; editing happens in bottom sheets. */
:root{
  --bg:#f7f4ee; --surface:#fffdf8; --fg:#142c2b; --muted:#5b6f6a; --line:#e2dccf;
  --accent:#a8693c; --accent-fg:#fffdf8;
  --slab:#142c2b; --slab-fg:#f2eee4; --slab-muted:#b8c9c3; --slab-accent:#dda77d;
  --empty:#9aa8a3; --danger:#b3412e; --ok:#2f7a5c; --overlay:rgba(20,44,43,.45);
  --work:#fff7d1; --offday:#e9e9e7; --out:#1f4e9c; --money:#1a6b4a; --paper:#ffffff; --paper-fg:#142c2b; --paper-line:#c9c3b6; --paper-off:#eeebe4;
  --f-fa:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-ui:"Manrope","Vazirmatn",system-ui,sans-serif;
  --f-display:"Cormorant Garamond",Georgia,serif;
  --f-body:var(--f-ui);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1f1e; --surface:#142c2b; --fg:#f2eee4; --muted:#a9bcb6; --line:#24423f;
  --accent:#dda77d; --accent-fg:#142c2b;
  --slab:#1c3a38; --slab-fg:#f2eee4; --slab-muted:#b8c9c3; --slab-accent:#dda77d;
  --work:#2a3524; --offday:#1a2827; --out:#8fb4ff; --money:#7fd1a8; --empty:#5f7772; --danger:#e58a75; --ok:#7fc8a5; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1f1e; --surface:#142c2b; --fg:#f2eee4; --muted:#a9bcb6; --line:#24423f;
  --accent:#dda77d; --accent-fg:#142c2b;
  --slab:#1c3a38; --slab-fg:#f2eee4; --slab-muted:#b8c9c3; --slab-accent:#dda77d;
  --work:#2a3524; --offday:#1a2827; --out:#8fb4ff; --money:#7fd1a8; --empty:#5f7772; --danger:#e58a75; --ok:#7fc8a5; --overlay:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body.fa{--f-body:var(--f-fa)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-block:12px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:17px;font-weight:700}
.brand small{color:var(--muted);font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);direction:ltr}
.langs button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--slab);color:var(--slab-fg)}
.langs button[data-l="fa"]{font-family:var(--f-fa)}
.month{display:flex;align-items:center;justify-content:center;gap:6px;direction:ltr}
.month span{min-width:9em;text-align:center;font-weight:700;font-size:16px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}

.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--empty);display:inline-block;flex:none}
.status[data-s="saved"] i{background:var(--ok)} .status[data-s="saving"] i{background:var(--accent)} .status[data-s="error"] i,.status[data-s="local"] i{background:var(--danger)}

.slab{background:var(--slab);color:var(--slab-fg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.slab .label{color:var(--slab-muted);font-size:13px}
.due{font-family:var(--f-display);font-size:52px;font-weight:600;line-height:1}
.due small{font-family:var(--f-ui);font-size:15px;color:var(--slab-accent);margin-inline-start:8px;letter-spacing:.06em}
.break{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;border-top:1px solid rgba(242,238,228,.14);padding-top:12px;margin:0}
.break dt{color:var(--slab-muted)} .break dd{margin:0;text-align:end}
.break .tot{color:var(--slab-fg);font-weight:700;border-top:1px solid rgba(242,238,228,.14);padding-top:6px}
.hint{font-size:12.5px;color:var(--slab-accent)}

.install{background:var(--surface);border:1.5px dashed var(--accent);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.install .ih{display:flex;gap:12px;align-items:center}
.install .ih img{border-radius:10px;flex:none}
.install .ih b{font-size:16px;line-height:1.3}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;font-size:15px;line-height:1.45}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--slab);color:var(--slab-fg);display:grid;place-items:center;font:700 14px var(--f-ui)}
.ico{width:22px;height:22px;vertical-align:-5px;margin-inline:3px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dots{color:var(--accent);font-size:20px;margin-inline:3px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px;align-self:center}
.pointer{position:fixed;left:47.3%;transform:translateX(calc(-100% + 24px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
.pointer svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (orientation:landscape){.pointer{display:none}}
@media (prefers-reduced-motion:no-preference){.pointer{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translate(calc(-100% + 24px),6px)}}}
.monthly{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#details.need .f:first-of-type input{border-color:var(--accent)}
.monthly.need{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.mh{display:flex;flex-direction:column;gap:2px}
.mh b{font-size:15px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money-in{position:relative;display:block;direction:ltr}
.money-in>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-ui);font-size:16px}
.money-in input{padding-left:26px;font-size:18px;font-weight:700}
.calcline{background:var(--bg);border-radius:10px;padding:8px 12px;font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:14px;direction:ltr;text-align:left}
.calcline b{font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi .v{font-size:20px;font-weight:700}
.kpi .k{font-size:12px;color:var(--muted)}

.actions{display:grid;grid-template-columns:1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);padding:14px;font-size:16px}
.actions .btn{padding-block:13px;font-size:15px}
.btn.print{background:var(--slab);color:var(--slab-fg);border-color:var(--slab)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}

h2{font-size:15px;margin:8px 0 0;font-weight:700}
.credit{display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:20px 8px;color:var(--muted);font-size:12.5px;text-align:center;border-top:1px solid var(--line);margin-top:12px}
.devrow{display:flex;align-items:center;gap:8px}
.bkicon{width:28px;height:28px;border-radius:7px;display:block;flex:none}
.credit .ver{font-size:10.5px;color:var(--empty);font-family:var(--f-ui)}
.credit b{color:var(--fg);font-family:var(--f-ui)}
.credit a{color:var(--accent);font-family:var(--f-ui);font-size:12px;text-decoration:none}
.bkv{width:min(150px,45%);aspect-ratio:7/2;border-radius:8px;opacity:.9;overflow:hidden;background:#0b192e}
.bkv video{width:100%;height:100%;display:block;object-fit:cover}
.bk{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr}
.bk img{width:40px;height:40px;display:block}
.bk-word{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--fg);letter-spacing:.02em}
.days{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day,.dhead{display:grid;grid-template-columns:52px 1fr 1fr .8fr;align-items:center;gap:4px 8px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:start}
.dhead{padding-block:8px;font-size:11px;color:var(--muted);font-weight:600;line-height:1.25;background:color-mix(in srgb,var(--line) 35%,transparent)}
.dhead span:not(:first-child),.day .c{text-align:end}
.day .c{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:14px;direction:ltr;unicode-bidi:isolate}
.day .c.km{font-weight:700;font-size:16px}
.day .chips{grid-column:2/-1;text-align:end}
.day .c:empty::after{content:"—";color:var(--empty)}
.day.off .c:empty::after{content:""}
.day .wtxt{grid-column:2/-1;font-size:12px;color:var(--empty)}
.days li:last-child .day{border-bottom:0}
.day .d{display:flex;flex-direction:column;line-height:1.15}
.day .d b{font-family:var(--f-ui);font-size:20px}
.day .d small{font-size:11px;color:var(--muted)}
.day .odo{font-size:13px;color:var(--muted);min-width:0}
.day .r{text-align:end;font-size:13px;white-space:nowrap}
.day .r b{font-family:var(--f-ui);font-size:16px;color:var(--fg)}
.day.empty .d b,.day.empty .odo{color:var(--empty)}
.day:not(.off){background:var(--work)}
.day .c.km.bad{color:var(--danger)!important}
.day .c.km,.kpi .v,#fuelCalc b{color:var(--out)}
.day.today{box-shadow:inset 4px 0 0 var(--accent)}
.day.off{cursor:default;padding-block:6px;background:var(--offday)}
.offband{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;background:var(--offday);color:var(--muted);font-size:12px;line-height:1.3;padding:5px 12px;border-bottom:1px solid var(--line)}
.offband .od{font-family:var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap;display:grid;grid-template-columns:30px 18px}
.offband .od span:last-child{text-align:right}
button.offband{width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);font-family:inherit;cursor:pointer}
.day .c:not(.km){color:var(--muted)}
.chip .num{color:var(--money)}
.day.off .d b{font-size:15px}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-inline-start:4px;color:var(--muted)}

details.settings{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}
details.settings summary{cursor:pointer;padding:10px 0;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:14px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input{font:inherit;font-family:var(--f-ui);font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input.txt{font-family:var(--f-body)}
input[inputmode]{direction:ltr;text-align:left}
.extra{display:grid;grid-template-columns:1fr 7.5em 38px;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--muted)}
.danger-zone{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.danger-zone b{font-size:14px}
.confirm{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--danger) 9%,transparent);border-radius:12px;padding:10px 12px}
.confirm .note{color:var(--fg)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;flex:none}

.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.odo-pair{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.odo-pair .f{justify-content:space-between}
.distbox{background:var(--slab);color:var(--slab-fg);border-radius:10px;padding:10px 12px;font-size:13px;direction:ltr;text-align:left;white-space:nowrap;overflow:hidden}
.distbox b{font-size:16px}
.calc{display:flex;justify-content:space-between;align-items:baseline;background:var(--bg);border-radius:12px;padding:10px 14px;gap:8px}
.calc b{font-family:var(--f-ui);font-size:26px}
.err{color:var(--danger);font-size:13px;min-height:1em}
.sec{font-size:13px;color:var(--muted);font-weight:600}
.phs{display:flex;flex-wrap:wrap;gap:8px}
.pth{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pth img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.pth button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
.pdfb{position:absolute;left:3px;bottom:3px;background:var(--slab);color:var(--slab-fg);font:700 9px var(--f-ui);padding:1px 4px;border-radius:4px}
.padd{width:64px;height:64px;border-radius:10px;border:1.5px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.padd input{display:none}
.park2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.stepper b{font-size:18px}
.parks{display:flex;flex-direction:column;gap:8px}
.park{display:grid;grid-template-columns:56px 1fr 38px;gap:8px;align-items:center}
.ph{width:56px;height:56px;border-radius:10px;border:1px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;cursor:pointer;overflow:hidden;position:relative;line-height:1.2}
.ph.has{border-style:solid;border-color:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--slab);color:var(--slab-fg);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
.viewer img{width:100%;border-radius:12px}

/* preview: phone-friendly, same look as the day list */
.pv{display:flex;flex-direction:column;gap:12px;font-family:var(--f-ui)}
.pv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.pv-co{font-size:12px;font-weight:700;color:var(--muted)}
.pv-title{font-size:17px;font-weight:700;line-height:1.2}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg);gap:3px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:700;background:none;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--slab);color:var(--slab-fg)}
.pv.bw{filter:grayscale(1)}
.pv.bw .pv-row:not(.off):not(.pv-th):not(.tot){background:var(--surface)}
.pv.bw .pv-row .km,.pv.bw .pv-row .mo,.pv.bw .pv-line b,.pv.bw .pv-line.due{color:var(--fg)!important}
.pv.bw .pv-line.due{border-top-color:var(--fg)}
.pv-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.pv-logo{height:22px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px 4px}
.pv-month{font-size:14px;font-weight:700;white-space:nowrap}
.pv-meta{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pv-meta div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pv-meta span{font-size:10.5px;color:var(--muted);line-height:1.25}
.pv-meta b{font-size:14px}
.pv-table{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.pv-row{display:grid;grid-template-columns:54px 1fr 1fr .62fr .9fr 46px;gap:5px;align-items:center;padding:7px 10px;background:var(--work);border-bottom:1px solid var(--line);font-size:13px}
.pv-row>span:not(:first-child){text-align:right}
.pv-row:last-child{border-bottom:0}
.pv-th{background:var(--surface);font-size:10px;font-weight:700;color:var(--muted);line-height:1.2;align-items:end}
.pv-row.off{background:var(--offday);padding-block:3px;font-size:11.5px;color:var(--muted)}
.pv-row.off .lab{grid-column:2/-1;text-align:left!important}
.pv-d{display:grid;grid-template-columns:34px 20px}
.pv-d i{font-style:normal}.pv-d b{font-weight:500;text-align:right}
.pv-row .km{color:var(--out);font-weight:700}
.pv-row .mo{color:var(--money);font-weight:700}
.pv-row .rc{color:var(--muted)}
.pv-row.tot{background:var(--surface);font-weight:700;border-top:2px solid var(--fg)}
.pv-sum{display:flex;flex-direction:column;gap:6px}
.pv-line{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.pv-line span{display:flex;flex-direction:column}
.pv-line small{font-size:11px;color:var(--muted)}
.pv-line b{color:var(--money)}
.pv-line.due{border-top:2px solid var(--out);padding-top:8px;margin-top:4px;font-size:17px;font-weight:700;color:var(--out)}
.pv-line.due b{color:var(--out);font-size:19px}
.pv-foot{font-size:11px;color:var(--muted)}
/* print preview: a sheet of paper, always light, mirrors the PDF */
.paper-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:var(--paper-off)}
.paper{background:var(--paper);color:var(--paper-fg);width:600px;margin:12px;padding:20px;font-family:"Manrope",Arial,sans-serif;font-size:10px;line-height:1.3;direction:ltr;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.paper h4{margin:0 0 6px;font-size:14px}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #c9c3b6}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{background:#e2e5e7;color:#111817;border-top:1.5px solid #111817;border-bottom:1.5px solid #111817;font-weight:600;padding:3px 4px;text-align:left;font-size:9px}
.paper th small{display:block;font-weight:400;opacity:.8}
.paper td{border-bottom:1px solid var(--paper-line);padding:2px 4px}
.paper td{background:#fff7d1}
.paper tr.off td{background:#e9e9e7;color:#8a8f8c}
.paper .wdn{display:inline-block;width:20px}.paper .dn{display:inline-block;width:12px;text-align:right}
.paper tr.off td{font-size:7px;padding:1px 4px;line-height:1.2}
.paper td:nth-child(2),.paper td:nth-child(3){color:#3e4846}
.paper td:nth-child(4){color:#1f4e9c;font-weight:700}.paper td:nth-child(5){color:#1a6b4a;font-weight:700}
.paper tr.tot td{background:#e9eff8}.paper .sum div:nth-child(even){color:#1a6b4a;font-weight:700}
.paper .sum .due{color:#123480!important;padding-top:4px;border:0;border-top:1.5px solid #123480}
.paper tr.tot td{font-weight:700;border-top:2px solid #142c2b}
.paper .sum{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin-top:10px;margin-inline-start:45%}
.paper .sum .due{font-family:inherit;font-size:12px;font-weight:700;border-top:2px solid #142c2b;padding-top:3px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* summary box: amounts in soft yellow, labels in plain white */
.slab #due{color:#F2C94C}
.slab .break dd{color:#F2C94C}
.slab .break dt{color:#F2EEE4}
/* input fields: copper border, glow on the field being typed in */
input:not([type="checkbox"]){border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line))}
input:not([type="checkbox"]):focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);outline:none}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}

</style>

<body>


<div class="wrap" id="app">
  <header>
    <div class="top">
      <div class="brand"><b id="coName"></b><small data-t="brandSub"></small></div>
      <div class="langs" role="group" aria-label="Language">
        <button data-l="en" aria-pressed="true">EN</button><button data-l="fr" aria-pressed="false">FR</button><button data-l="fa" aria-pressed="false">فا</button>
      </div>
    </div>
    <div class="month">
      <button class="icon-btn" id="prev" aria-label="Previous month">‹</button>
      <span id="monthName">—</span>
      <button class="icon-btn" id="next" aria-label="Next month">›</button>
    </div>
  </header>

  <div class="install" id="install" hidden>
    <div class="ih"><img src="icons/icon-192.png" alt="" width="40" height="40"><b data-t="installTitle"></b></div>
    <ol class="steps" id="installSteps"></ol>
    <div class="note" id="installFoot"></div>
    <div class="row"><button class="btn primary" id="installBtn" hidden data-t="installBtn"></button><button class="btn primary" id="copyLink" hidden data-t="copyLink"></button></div>
    <button class="linkbtn" id="installX" data-t="installLater"></button>
  </div>

  <div class="status" id="status" data-s="loading"><i></i><span></span></div>

  <section class="slab">
    <div class="label" data-t="dueLabel"></div>
    <div class="due"><span class="num" id="due">0.00</span><small>CAD</small></div>
    <dl class="break" id="break"></dl>
    <div class="hint" id="rateHint" hidden data-t="fuelHint"></div>
  </section>

  <section class="monthly" id="details">
    <div class="mh"><b data-t="detailsTitle"></b></div>
    <label class="f"><span data-t="sName"></span><input class="txt" id="sName" autocomplete="name" data-tp="namePh"></label>
    <label class="f"><span data-t="sCompany"></span><input class="txt" id="sCompany" autocomplete="organization" data-tp="coPh"></label>
  </section>

  <section class="monthly" id="monthly">
    <div class="mh"><b data-t="monthlyTitle"></b><span class="note" data-t="monthlyNote"></span></div>
    <div class="mgrid">
      <label class="f"><span data-t="sFuel"></span><span class="money-in"><span>$</span><input id="sFuel" inputmode="decimal" placeholder="0.00"></span></label>
      <label class="f"><span data-t="sOt"></span><span class="money-in"><span>$</span><input id="sOt" inputmode="decimal" placeholder="0.00"></span></label>
    </div>
    <label class="f"><span data-t="sOtNote"></span><input class="txt" id="sOtNote" data-tp="otNotePh"></label>
    <div class="calcline" id="fuelCalc"></div>
  </section>

  <div class="kpis">
    <div class="kpi"><div class="v num" id="kKm">0</div><div class="k" data-t="kpiKm"></div></div>
    <div class="kpi"><div class="v num" id="kDays">0</div><div class="k" data-t="kpiDays"></div></div>
    <div class="kpi"><div class="v num" id="kPark">$0.00</div><div class="k" data-t="kpiPark"></div></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="todayBtn"></button>
    <button class="btn" id="previewBtn" data-t="previewBtn"></button>
    <button class="btn print pbtn" id="printBtn" data-t="printBtn"></button>
  </div>

  <details class="settings" id="settings">
    <summary data-t="settings"></summary>
    <div class="grid">
      <label class="f"><span data-t="sPhone"></span><input id="sPhone" inputmode="decimal" placeholder="30.00"></label>
      <label class="f"><span data-t="sLease"></span><input id="sLease" inputmode="decimal" placeholder="500.00"></label>
      <div class="note full" data-t="sNote"></div>
      <label class="check full"><input type="checkbox" id="sWe"><span data-t="sWe"></span></label>
      <div class="full" style="display:flex;flex-direction:column;gap:8px">
        <div class="note" data-t="extrasNote"></div>
        <div id="extras" style="display:flex;flex-direction:column;gap:8px"></div>
        <button class="btn ghost" id="addExtra" type="button" data-t="addExtra"></button>
      </div>
      <div class="full" style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px">
        <b data-t="backupTitle" style="font-size:14px"></b>
        <div class="note" data-t="backupNote"></div>
        <div class="row"><button class="btn" id="bkBtn" type="button" data-t="backup"></button><label class="btn" style="text-align:center;cursor:pointer;flex:1"><span data-t="restore"></span><input type="file" id="rsFile" accept="application/json,.json" hidden></label></div>
      </div>
      <div class="full" style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px">
        <b data-t="otherExports" style="font-size:14px"></b>
        <div class="row"><button class="btn" id="csvBtn" type="button" data-t="csvBtn"></button><button class="btn" id="copyBtn" type="button" data-t="copyBtn"></button></div>
      </div>
      <div class="full danger-zone">
        <b data-t="clearTitle"></b>
        <button class="btn danger" id="clrMonth" type="button" data-t="clearMonth"></button>
        <div class="confirm" id="clrConfirm" hidden><div class="note" id="clrQ"></div><div class="row"><button class="btn danger" id="clrYes" type="button" data-t="yes"></button><button class="btn" id="clrNo" type="button" data-t="no"></button></div></div>
        <button class="btn ghost danger" id="eraseBtn" type="button" data-t="eraseAll"></button>
        <div class="confirm" id="eraseConfirm" hidden><div class="note" data-t="eraseQ"></div><div class="row"><button class="btn danger" id="eraseYes" type="button" data-t="yes"></button><button class="btn" id="eraseNo" type="button" data-t="no"></button></div></div>
      </div>
    </div>
  </details>

  <h2 data-t="days"></h2>
  <ul class="days" id="days"></ul>

  <footer class="credit">

const pad=n=>String(n).padStart(2,"0");
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const toNum=v=>{if(v==null||v==="")return null;
  let t=String(v).trim().replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g,".").replace(/[٬\s  $]/g,"");
  if(t.includes(",")&&t.includes("."))t=t.lastIndexOf(",")>t.lastIndexOf(".")?t.replace(/\./g,"").replace(",","."):t.replace(/,/g,"");
  else if(t.includes(","))t=/^\d{1,3}(,\d{3})+$/.test(t)?t.replace(/,/g,""):t.replace(",",".");   // 84,210 = thousands; 12,50 = decimal
  const n=parseFloat(t);return isNaN(n)?null:n};
const fmtRate=n=>{n=+n||0;return Math.abs(n*100-Math.round(n*100))<1e-9?n.toFixed(2):String(+n.toFixed(4))};

const parksOf=d=>(d&&d.parks)||[];
const parkOf=d=>d&&d.park!=null?(toNum(d.park)||0):parksOf(d).reduce((a,p)=>a+(toNum(p.amt)||0),0);
const photosOf=d=>[...((d&&d.photos)||[]),...parksOf(d).filter(x=>x.photo).map(x=>x.photo)];
const recOf=d=>d&&d.rec!=null?(parseInt(d.rec)||0):parksOf(d).length;
const hasData=d=>!!(d&&(d.start||d.end||d.note||parkOf(d)||recOf(d)||photosOf(d).length));
const isOpen=i=>!isWeekend(i)||state.settings.weekends||hasData(state.days[i]);

const blank=s=>{const c={};if(s)CARRY.forEach(k=>{if(s[k]!==undefined)c[k]=s[k]});return{settings:{...DEFAULTS,...c},days:{}}};
// older saves kept one parking amount plus a receipts list
function normDay(d){if(!d||d.parks)return d;const parks=[],rec=[...(d.receipts||[])];
  if(toNum(d.park))parks.push({amt:d.park,photo:rec.shift()||null});rec.forEach(r=>parks.push({amt:"",photo:r}));
  const o={...d,parks};delete o.park;delete o.receipts;return o}

const PDFJS_URLS=["vendor/pdf.min.js","vendor/pdf.worker.min.js"];

const PT={en:{title:"Car Expense Log",emp:"Employee name",fuel:"Fuel cost (CAD) per 100 km",ot:"Additional amount",date:"Date",start:"Start odometer",end:"End odometer",km:"Work km",park:"Parking",rec:"Receipts",weekend:"Weekend",notravel:"No travel",total:"TOTAL",

 fr:{title:"Journal des dépenses automobile",emp:"Nom de l'employé",fuel:"Prix de l'essence (CAD) par 100 km",ot:"Montant additionnel",date:"Date",start:"Odomètre de départ",end:"Odomètre final",km:"Total des kms (travail)",park:"Parcomètre",rec:"Reçus",weekend:"Fin de semaine",notravel:"Aucun déplacement",total:"TOTAL",

const pl=()=>lang==="fr"?"fr":"en";
function formRows(L){L=L||PT[pl()];const out=[];for(let i=1;i<=daysIn();i++){const d=state.days[i]||{},wd=new Date(ym.y,ym.m,i).getDay();
  out.push({i,off:!isOpen(i)||isOffDay(i),reason:isOffDay(i)?"notravel":"weekend",label:`${L.wd[wd]} ${pad(i)}`,wdn:L.wd[wd],dn:pad(i),start:d.start?fmtInt(toNum(d.start)):"",end:d.end?fmtInt(toNum(d.end)):"",km:kmOf(d)?fmtInt(kmOf(d)):"",park:parkOf(d)?money(parkOf(d)):"",rec:recOf(d)||""})}return out}
function groupRows(rows){const g=[];rows.forEach(r=>{const last=g[g.length-1];if(false)last.items.push(r);else g.push({off:r.off,items:[r]})});return g}
const offLabel=(g,L)=>g.items[0].label+" · "+L[g.items[0].reason];
function sumLines(x,L){L=L||PT[pl()];const R=[[L.kmLine,`${fmtInt(x.km)} km ÷ 100 × $${fmtRate(x.fuel)}`,x.kmAmt],[L.parkLine,"",x.park],[L.phone,"",x.phone],[L.lease,"",x.lease],[L.otLine+(state.settings.otNote?` (${state.settings.otNote})`:""),"",x.ot]];
  x.extras.forEach(e=>R.push([e.label,"",e.amt]));return R}
function previewHtml(){
  // Phone-friendly preview in the app's own style; same content as the PDF.
  const s=state.settings,x=totals(),k=pl(),L=PT[k];

    return r.off?`<div class="pv-row off">${d}<span class="lab">${L[r.reason]}</span></div>`

  $("installSteps").innerHTML=t(kind).map(x=>`<li><span>${x}</span></li>`).join("");
  $("installFoot").textContent=kind==="iosSafari"?t("iosFoot"):kind==="android"?t("androidFoot"):"";
  $("installBtn").hidden=kind!=="androidPrompt";$("copyLink").hidden=!/InApp/.test(kind);
  $("pointer").hidden=!(kind==="iosSafari"&&/iPhone|iPod/i.test(UA));
  $("install").hidden=false}
$("copyLink").onclick=()=>{const u=location.href.split("#")[0];try{navigator.clipboard.writeText(u).then(()=>toast(t("linkCopied")),()=>viewText(u))}catch(e){viewText(u)}};
addEventListener("scroll",()=>{if(!$("pointer").hidden&&scrollY>400)$("pointer").hidden=true},{passive:true});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;showInstall()});
addEventListener("appinstalled",()=>{$("install").hidden=true});
$("installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;$("install").hidden=true;$("pointer").hidden=true};
$("installX").onclick=()=>{$("install").hidden=true;$("pointer").hidden=true;try{localStorage.setItem("carlog:installHide","1")}catch(e){}};

// ---------- boot ----------
state=blank();applyLang();setStatus("loading");showInstall();
(async()=>{
  assets=localAssets;downloads={save:saveFile};mode="local";
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{const all=await idbAll();for(const [id,b] of Object.entries(all))PHOTO[id]=URL.createObjectURL(b)}catch(e){}
  await loadMonth();
})();
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  // a new version took over: reload once so the phone shows it right away
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController&&!reloaded){reloaded=true;location.reload()}});
  addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(r=>{r.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{})});
}
})();
</script>
