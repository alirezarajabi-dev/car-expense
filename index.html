<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Car Expense Log: daily odometer readings, parking receipts and month-end fuel price, exported as a printable PDF. Developed by Alex Rajabi · Bizkonic.">
<meta name="theme-color" content="#142c2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Expense">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Car Expense Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap">
<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* Layout: one phone column. Dark summary slab on top, then the month as a list of day rows; editing happens in bottom sheets. */
:root{
  --bg:#f7f4ee; --surface:#fffdf8; --fg:#142c2b; --muted:#5b6f6a; --line:#e2dccf;
  --accent:#a8693c; --accent-fg:#fffdf8;
  --slab:#142c2b; --slab-fg:#f2eee4; --slab-muted:#b8c9c3; --slab-accent:#dda77d;
  --empty:#9aa8a3; --danger:#b3412e; --ok:#2f7a5c; --overlay:rgba(20,44,43,.45);
  --work:#fff7d1; --offday:#e9e9e7; --out:#1f4e9c; --money:#1a6b4a; --paper:#ffffff; --paper-fg:#142c2b; --paper-line:#c9c3b6; --paper-off:#eeebe4;
  --f-fa:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-ui:"Manrope","Vazirmatn",system-ui,sans-serif;
  --f-display:"Cormorant Garamond",Georgia,serif;
  --f-body:var(--f-ui);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1f1e; --surface:#142c2b; --fg:#f2eee4; --muted:#a9bcb6; --line:#24423f;
  --accent:#dda77d; --accent-fg:#142c2b;
  --slab:#1c3a38; --slab-fg:#f2eee4; --slab-muted:#b8c9c3; --slab-accent:#dda77d;
  --work:#2a3524; --offday:#1a2827; --out:#8fb4ff; --money:#7fd1a8; --empty:#5f7772; --danger:#e58a75; --ok:#7fc8a5; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1f1e; --surface:#142c2b; --fg:#f2eee4; --muted:#a9bcb6; --line:#24423f;
  --accent:#dda77d; --accent-fg:#142c2b;
  --slab:#1c3a38; --slab-fg:#f2eee4; --slab-muted:#b8c9c3; --slab-accent:#dda77d;
  --work:#2a3524; --offday:#1a2827; --out:#8fb4ff; --money:#7fd1a8; --empty:#5f7772; --danger:#e58a75; --ok:#7fc8a5; --overlay:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body.fa{--f-body:var(--f-fa)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-block:12px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:17px;font-weight:700}
.brand small{color:var(--muted);font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);direction:ltr}
.langs button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--slab);color:var(--slab-fg)}
.langs button[data-l="fa"]{font-family:var(--f-fa)}
.month{display:flex;align-items:center;justify-content:center;gap:6px;direction:ltr}
.month span{min-width:9em;text-align:center;font-weight:700;font-size:16px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}

.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--empty);display:inline-block;flex:none}
.status[data-s="saved"] i{background:var(--ok)} .status[data-s="saving"] i{background:var(--accent)} .status[data-s="error"] i,.status[data-s="local"] i{background:var(--danger)}

.slab{background:var(--slab);color:var(--slab-fg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.slab .label{color:var(--slab-muted);font-size:13px}
.due{font-family:var(--f-display);font-size:52px;font-weight:600;line-height:1}
.due small{font-family:var(--f-ui);font-size:15px;color:var(--slab-accent);margin-inline-start:8px;letter-spacing:.06em}
.break{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;border-top:1px solid rgba(242,238,228,.14);padding-top:12px;margin:0}
.break dt{color:var(--slab-muted)} .break dd{margin:0;text-align:end}
.break .tot{color:var(--slab-fg);font-weight:700;border-top:1px solid rgba(242,238,228,.14);padding-top:6px}
.hint{font-size:12.5px;color:var(--slab-accent)}

.install{background:var(--surface);border:1.5px dashed var(--accent);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.install .ih{display:flex;gap:12px;align-items:center}
.install .ih img{border-radius:10px;flex:none}
.monthly{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#details.need .f:first-of-type input{border-color:var(--accent)}
.monthly.need{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.mh{display:flex;flex-direction:column;gap:2px}
.mh b{font-size:15px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money-in{position:relative;display:block;direction:ltr}
.money-in>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-ui);font-size:16px}
.money-in input{padding-left:26px;font-size:18px;font-weight:700}
.calcline{background:var(--bg);border-radius:10px;padding:8px 12px;font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:14px;direction:ltr;text-align:left}
.calcline b{font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi .v{font-size:20px;font-weight:700}
.kpi .k{font-size:12px;color:var(--muted)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);padding:14px;font-size:16px}
.actions .primary,.actions .print{grid-column:1/-1}
.btn.print{background:var(--slab);color:var(--slab-fg);border-color:var(--slab)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}

h2{font-size:15px;margin:8px 0 0;font-weight:700}
.credit{display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:20px 8px;color:var(--muted);font-size:12.5px;text-align:center;border-top:1px solid var(--line);margin-top:12px}
.credit b{color:var(--fg);font-family:var(--f-ui)}
.credit a{color:var(--accent);font-family:var(--f-ui);font-size:12px;text-decoration:none}
.bk{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr}
.bk img{width:40px;height:40px;display:block}
.bk-word{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--fg);letter-spacing:.02em}
.days{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day,.dhead{display:grid;grid-template-columns:52px 1fr 1fr .8fr;align-items:center;gap:4px 8px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:start}
.dhead{padding-block:8px;font-size:11px;color:var(--muted);font-weight:600;line-height:1.25;background:color-mix(in srgb,var(--line) 35%,transparent)}
.dhead span:not(:first-child),.day .c{text-align:end}
.day .c{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:14px;direction:ltr;unicode-bidi:isolate}
.day .c.km{font-weight:700;font-size:16px}
.day .chips{grid-column:2/-1;text-align:end}
.day .c:empty::after{content:"—";color:var(--empty)}
.day.off .c:empty::after{content:""}
.day .wtxt{grid-column:2/-1;font-size:12px;color:var(--empty)}
.days li:last-child .day{border-bottom:0}
.day .d{display:flex;flex-direction:column;line-height:1.15}
.day .d b{font-family:var(--f-ui);font-size:20px}
.day .d small{font-size:11px;color:var(--muted)}
.day .odo{font-size:13px;color:var(--muted);min-width:0}
.day .r{text-align:end;font-size:13px;white-space:nowrap}
.day .r b{font-family:var(--f-ui);font-size:16px;color:var(--fg)}
.day.empty .d b,.day.empty .odo{color:var(--empty)}
.day:not(.off){background:var(--work)}
.day .c.km,.kpi .v,#fuelCalc b{color:var(--out)}
.day.today{box-shadow:inset 4px 0 0 var(--accent)}
.day.off{cursor:default;padding-block:6px;background:var(--offday)}
.offband{background:var(--offday);color:var(--empty);font-size:11.5px;padding:3px 12px;border-bottom:1px solid var(--line)}
.day .c:not(.km){color:var(--muted)}
.chip .num{color:var(--money)}
.day.off .d b{font-size:15px}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-inline-start:4px;color:var(--muted)}

details.settings{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}
details.settings summary{cursor:pointer;padding:10px 0;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:14px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input{font:inherit;font-family:var(--f-ui);font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input.txt{font-family:var(--f-body)}
input[inputmode]{direction:ltr;text-align:left}
.extra{display:grid;grid-template-columns:1fr 7.5em 38px;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--muted)}
.danger-zone{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.danger-zone b{font-size:14px}
.confirm{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--danger) 9%,transparent);border-radius:12px;padding:10px 12px}
.confirm .note{color:var(--fg)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;flex:none}

.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.odo-pair{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.odo-pair .f{justify-content:space-between}
.distbox{background:var(--slab);color:var(--slab-fg);border-radius:10px;padding:10px 12px;font-size:13px;direction:ltr;text-align:left;white-space:nowrap;overflow:hidden}
.distbox b{font-size:16px}
.calc{display:flex;justify-content:space-between;align-items:baseline;background:var(--bg);border-radius:12px;padding:10px 14px;gap:8px}
.calc b{font-family:var(--f-ui);font-size:26px}
.err{color:var(--danger);font-size:13px;min-height:1em}
.sec{font-size:13px;color:var(--muted);font-weight:600}
.parks{display:flex;flex-direction:column;gap:8px}
.park{display:grid;grid-template-columns:56px 1fr 38px;gap:8px;align-items:center}
.ph{width:56px;height:56px;border-radius:10px;border:1px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;cursor:pointer;overflow:hidden;position:relative;line-height:1.2}
.ph.has{border-style:solid;border-color:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--slab);color:var(--slab-fg);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
.viewer img{width:100%;border-radius:12px}

/* print preview: a sheet of paper, always light, mirrors the PDF */
.paper-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:var(--paper-off)}
.paper{background:var(--paper);color:var(--paper-fg);width:600px;margin:12px;padding:20px;font-family:"Manrope",Arial,sans-serif;font-size:10px;line-height:1.3;direction:ltr;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.paper h4{margin:0 0 6px;font-size:14px}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-bottom:8px}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{background:#142c2b;color:#f7f4ee;font-weight:600;padding:3px 4px;text-align:left;font-size:9px}
.paper th small{display:block;font-weight:400;opacity:.8}
.paper td{border-bottom:1px solid var(--paper-line);padding:2px 4px}
.paper td{background:#fff7d1}
.paper tr.off td{background:#e9e9e7;color:#8a8f8c}
.paper tr.off td{font-size:7px;padding:1px 4px;line-height:1.2}
.paper td:nth-child(2),.paper td:nth-child(3){color:#3e4846}
.paper td:nth-child(4){color:#1f4e9c;font-weight:700}.paper td:nth-child(5){color:#1a6b4a;font-weight:700}
.paper tr.tot td{background:#e9eff8}.paper .sum div:nth-child(even){color:#1a6b4a;font-weight:700}
.paper .sum .due{background:#1f4e9c;color:#fff!important;padding:4px 6px;border:0}
.paper tr.tot td{font-weight:700;border-top:2px solid #142c2b}
.paper .sum{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin-top:10px;margin-inline-start:45%}
.paper .sum .due{font-family:inherit;font-size:12px;font-weight:700;border-top:2px solid #142c2b;padding-top:3px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>


<div class="wrap" id="app">
  <header>
    <div class="top">
      <div class="brand"><b id="coName"></b><small data-t="brandSub"></small></div>
      <div class="langs" role="group" aria-label="Language">
        <button data-l="en" aria-pressed="true">EN</button><button data-l="fr" aria-pressed="false">FR</button><button data-l="fa" aria-pressed="false">فا</button>
      </div>
    </div>
    <div class="month">
      <button class="icon-btn" id="prev" aria-label="Previous month">‹</button>
      <span id="monthName">—</span>
      <button class="icon-btn" id="next" aria-label="Next month">›</button>
    </div>
  </header>

  <div class="install" id="install" hidden>
    <div class="ih"><img src="icons/icon-192.png" alt="" width="40" height="40"><div><b data-t="installTitle"></b><div class="note" id="installHow"></div></div></div>
    <div class="row"><button class="btn primary" id="installBtn" hidden data-t="installBtn"></button><button class="btn ghost" id="installX" data-t="installLater"></button></div>
  </div>

  <div class="status" id="status" data-s="loading"><i></i><span></span></div>

  <section class="slab">
    <div class="label" data-t="dueLabel"></div>
    <div class="due"><span class="num" id="due">0.00</span><small>CAD</small></div>
    <dl class="break" id="break"></dl>
    <div class="hint" id="rateHint" hidden data-t="fuelHint"></div>
  </section>

  <section class="monthly" id="details">
    <div class="mh"><b data-t="detailsTitle"></b></div>
    <label class="f"><span data-t="sName"></span><input class="txt" id="sName" autocomplete="name" data-tp="namePh"></label>
    <label class="f"><span data-t="sCompany"></span><input class="txt" id="sCompany" autocomplete="organization" data-tp="coPh"></label>
  </section>

  <section class="monthly" id="monthly">
    <div class="mh"><b data-t="monthlyTitle"></b><span class="note" data-t="monthlyNote"></span></div>
    <div class="mgrid">
      <label class="f"><span data-t="sFuel"></span><span class="money-in"><span>$</span><input id="sFuel" inputmode="decimal" placeholder="21.45"></span></label>
      <label class="f"><span data-t="sOt"></span><span class="money-in"><span>$</span><input id="sOt" inputmode="decimal" placeholder="0.00"></span></label>
    </div>
    <label class="f"><span data-t="sOtNote"></span><input class="txt" id="sOtNote" data-tp="otNotePh"></label>
    <div class="calcline" id="fuelCalc"></div>
  </section>

  <div class="kpis">
    <div class="kpi"><div class="v num" id="kKm">0</div><div class="k" data-t="kpiKm"></div></div>
    <div class="kpi"><div class="v num" id="kDays">0</div><div class="k" data-t="kpiDays"></div></div>
    <div class="kpi"><div class="v num" id="kPark">$0.00</div><div class="k" data-t="kpiPark"></div></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="todayBtn"></button>
    <button class="btn print" id="printBtn" data-t="printBtn"></button>
    <button class="btn" id="csvBtn" data-t="csvBtn"></button>
    <button class="btn" id="copyBtn" data-t="copyBtn"></button>
  </div>

  <details class="settings" id="settings">
    <summary data-t="settings"></summary>
    <div class="grid">
      <label class="f"><span data-t="sPhone"></span><input id="sPhone" inputmode="decimal" placeholder="30.00"></label>
      <label class="f"><span data-t="sLease"></span><input id="sLease" inputmode="decimal" placeholder="500.00"></label>
      <div class="note full" data-t="sNote"></div>
      <label class="check full"><input type="checkbox" id="sWe"><span data-t="sWe"></span></label>
      <div class="full" style="display:flex;flex-direction:column;gap:8px">
        <div class="note" data-t="extrasNote"></div>
        <div id="extras" style="display:flex;flex-direction:column;gap:8px"></div>
        <button class="btn ghost" id="addExtra" type="button" data-t="addExtra"></button>
      </div>
      <div class="full" style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px">
        <b data-t="backupTitle" style="font-size:14px"></b>
        <div class="note" data-t="backupNote"></div>
        <div class="row"><button class="btn" id="bkBtn" type="button" data-t="backup"></button><label class="btn" style="text-align:center;cursor:pointer;flex:1"><span data-t="restore"></span><input type="file" id="rsFile" accept="application/json,.json" hidden></label></div>
      </div>
      <div class="full danger-zone">

function normDay(d){if(!d||d.parks)return d;const parks=[],rec=[...(d.receipts||[])];
  if(toNum(d.park))parks.push({amt:d.park,photo:rec.shift()||null});rec.forEach(r=>parks.push({amt:"",photo:r}));
  const o={...d,parks};delete o.park;delete o.receipts;return o}
function normState(s){for(const k in s.days)s.days[k]=normDay(s.days[k]);return s}

// ---------- calc ----------
function kmOf(d){if(!d)return 0;const a=toNum(d.start),b=toNum(d.end);return(a!=null&&b!=null&&b>=a)?b-a:0}
function totals(){
  const s=state.settings;let km=0,park=0,rec=0,filled=0;
  for(const k in state.days){const d=state.days[k];km+=kmOf(d);park+=parkOf(d);rec+=parksOf(d).length;if(hasData(d))filled++}
  const fuel=toNum(s.fuel)||0,kmAmt=km/100*fuel,ot=toNum(s.ot)||0,phone=toNum(s.phone)||0,lease=toNum(s.lease)||0;
  const extras=(s.extras||[]).filter(e=>e.label||toNum(e.amt)).map(e=>({label:e.label||t("other"),amt:toNum(e.amt)||0}));
  const due=kmAmt+park+ot+phone+lease+extras.reduce((a,e)=>a+e.amt,0);
  return{km,park,rec,filled,fuel,kmAmt,ot,phone,lease,extras,due};
}

function setStatus(k){statusKey=k;const map={loading:"loading",savedAcct:"saved",saved:"saved",saving:"saving",saveErr:"error",localOnly:"saved"};$("status").dataset.s=map[k]||"loading";$("status").querySelector("span").textContent=t(k)}

// ---------- storage ----------
let saving=false,dirty=false,saveTimer=null;
function scheduleSave(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
async function flush(){
  if(saving||!dirty||!state)return;dirty=false;
  const k=key(),payload=JSON.parse(JSON.stringify({...state,updated:Date.now()}));
  if(mode!=="db"){try{localStorage.setItem("carlog:"+k,JSON.stringify(payload));localStorage.setItem("carlog:defaults",JSON.stringify(state.settings))}catch(e){}setStatus("localOnly");return}
  saving=true;setStatus("saving");
  try{
    await db.doc(`data/users/${uid}/${k}`).set(payload);
    await db.doc(`data/users/${uid}/defaults`).set({settings:payload.settings,updated:Date.now()});
    setStatus("saved");
  }catch(e){setStatus("saveErr");dirty=true;setTimeout(flush,4000)}
  saving=false;if(dirty)flush();
}
async function loadMonth(){
  state=null;setStatus("loading");
  const k=key();
  if(mode==="db"){
    let timedOut=false;const timer=setTimeout(()=>{timedOut=true;mode="local";loadMonth()},10000);
    try{
      const snap=await db.doc(`data/users/${uid}/${k}`).get();
      if(timedOut)return;
      let s;
      if(snap.exists){const v=snap.data();s={settings:{...DEFAULTS,...(v.settings||{})},days:v.days||{}}}
      else{const d=await db.doc(`data/users/${uid}/defaults`).get();if(timedOut)return;s=blank(d.exists?d.data().settings:null)}
      clearTimeout(timer);state=normState(s);setStatus("savedAcct");
    }catch(e){clearTimeout(timer);if(timedOut)return;mode="local";return loadMonth()}
  }else{
    let raw=null,def=null;try{raw=JSON.parse(localStorage.getItem("carlog:"+k)||"null");def=JSON.parse(localStorage.getItem("carlog:defaults")||"null")}catch(e){}
    state=normState(raw?{settings:{...DEFAULTS,...raw.settings},days:raw.days||{}}:blank(def));
    setStatus("localOnly");
  }
  render();
}

    $("dParks").innerHTML=draft.parks.map((p,i)=>`<div class="park">
      <label class="ph${p.photo?" has":""}" aria-label="${esc(t("photo"))}">${p.photo?`<img src="${esc(blobUrl(p.photo))}" alt="" data-view="${i}">`:esc(t("photo"))}${assets&&!p.photo?`<input type="file" accept="image/*" data-file="${i}">`:""}</label>

      <button class="icon-btn" data-delp="${i}" aria-label="${esc(t("remove"))}">×</button></div>`).join("");
    upd();
  };

  };

function viewImg(src,onRemove){
  const h=document.createElement("div");h.className="sheet-bg";h.style.zIndex=25;
  h.innerHTML=`<div class="sheet viewer"><img src="${esc(src)}" alt=""><div class="row"><button class="btn" data-a="close">${t("close")}</button><button class="btn danger" data-a="rm">${t("remove")}</button></div></div>`;
  h.onclick=e=>{const a=e.target.dataset.a;if(a==="rm"){onRemove();h.remove()}else if(a==="close"||e.target===h)h.remove()};
  document.body.appendChild(h);
}
async function shrink(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",.82));
  }catch(e){return file}
}

  const rows=groupRows(formRows(L)).map(g=>{const r=g.items[0];return g.off?`<tr class="off"><td colspan="6">${esc(offLabel(g,L))}</td></tr>`:`<tr><td>${esc(r.label)}</td><td>${r.start}</td><td>${r.end}</td><td>${r.km}</td><td>${r.park?"$"+r.park:""}</td><td>${r.rec}</td></tr>`}).join("");
  return `<div class="paper">${s.company?`<div style="font-size:12px;font-weight:700;letter-spacing:.04em">${esc(s.company)}</div>`:""}<h4>${L.title} · ${MONTHS[k][ym.m]} ${ym.y}</h4>
  <div class="meta"><div><b>${L.emp}:</b> ${esc(s.name)||"________"}</div><div><b>${L.fuel}:</b> $${fmtRate(x.fuel)}</div><div><b>${L.ot}:</b> $${money(x.ot)}</div></div>
  <table><thead><tr><th>${L.date}</th><th>${L.start}</th><th>${L.end}</th><th>${L.km}</th><th>${L.park}</th><th>${L.rec}</th></tr></thead>
  <tbody>${rows}<tr class="tot"><td>${L.total}</td><td></td><td></td><td>${fmtInt(x.km)}</td><td>$${money(x.park)}</td><td>${x.rec}</td></tr></tbody></table>
  <div class="sum">${sumLines(x,L).map(([l,f,v])=>`<div>${esc(l)}${f?` <span style="color:#6b736f">(${f})</span>`:""}</div><div>$${money(v)}</div>`).join("")}<div class="due">${L.due}</div><div class="due">$${money(x.due)}</div></div><div style="margin-top:14px;color:#6b736f;font-size:8px">${L.dev} Alex Rajabi · Bizkonic</div></div>`;
}
async function imgData(src){const r=await fetch(src);const b=await r.blob();const bmp=await createImageBitmap(b);const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;c.getContext("2d").drawImage(bmp,0,0);return{data:c.toDataURL("image/jpeg",.85),w:bmp.width,h:bmp.height}}
async function buildPdf(withReceipts){
  // US/Canada Letter: 8.5 x 11 in = 612 x 792 pt, 0.5 in margins
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"letter",orientation:"portrait"});
  const s=state.settings,x=totals(),M=36,W=612-2*M,ink=[20,44,43],grey=[95,104,100],OUT=[31,78,156];
  const font=(w,sz,c)=>{doc.setFont("helvetica",w);doc.setFontSize(sz);doc.setTextColor(...(c||ink))};
  const k=pl(),L=PT[k];
  let y=44;
  if(s.company){font("bold",11);doc.text(s.company,M,y);y+=20}
  font("bold",18);doc.text(L.title,M,y);
  font("bold",13);doc.text(`${MONTHS[k][ym.m]} ${ym.y}`,M+W,y,{align:"right"});
  // details box
  y+=12;const bh=42;doc.setDrawColor(190,184,172);doc.setLineWidth(.7);doc.rect(M,y,W,bh);
  const cell=(cx,lab,val)=>{font("normal",8.5,grey);doc.text(lab,cx,y+15);font("bold",12);doc.text(val,cx,y+32)};
  cell(M+10,L.emp,s.name||"");
  cell(M+W*.47,L.fuel,"$"+fmtRate(x.fuel));
  cell(M+W*.80,L.ot,"$"+money(x.ot));
  y+=bh+12;
  // table
  const cols=[{h:L.date,f:"",w:86},{h:L.start,f:"",w:108},{h:L.end,f:"",w:104},{h:L.km,f:"",w:120},{h:L.park,f:"",w:70},{h:L.rec,f:"",w:W-488}];
  const hh=30;doc.setFillColor(...ink);doc.rect(M,y,W,hh,"F");
  let cx=M;cols.forEach((c,ci)=>{const right=ci>0;const tx=right?cx+c.w-6:cx+6;const o=right?{align:"right"}:{};
    doc.setTextColor(247,244,238);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(c.h,tx,y+(c.f?13:19),o);
    if(c.f){doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.text(c.f,tx,y+24,o)}cx+=c.w});
  y+=hh;
  const rows=formRows(L),groups=groupRows(rows),nOn=rows.filter(r=>!r.off).length,nBand=groups.filter(g=>g.off).length;
  const MONEY=[26,107,74],ODO=[62,72,70];
  const tableEnd=604,avail=tableEnd-y-22;
  const rh=Math.min(20,(avail-nBand*8)/nOn),bandH=8;
  groups.forEach(g=>{
    if(g.off){doc.setFillColor(236,236,234);doc.rect(M,y,W,bandH,"F");font("normal",6.2,[128,133,130]);doc.text(offLabel(g,L),M+6,y+5.8);y+=bandH;return}
    const r=g.items[0],h=rh;
    doc.setFillColor(255,248,214);doc.rect(M,y,W,h,"F");
    doc.setDrawColor(232,222,186);doc.setLineWidth(.5);doc.line(M,y+h,M+W,y+h);
    const cells=[r.label,r.start,r.end,r.km,r.park?"$"+r.park:"",String(r.rec)],colr=[ink,ODO,ODO,OUT,MONEY,grey];
    let xx=M;cells.forEach((v,ci)=>{const c=cols[ci];font(ci===3||ci===4?"bold":"normal",10,colr[ci]);
      if(ci===0)doc.text(v,xx+6,y+h/2+3.5);else if(v)doc.text(v,xx+c.w-6,y+h/2+3.5,{align:"right"});xx+=c.w});
    y+=h;
  });
  // total band
  doc.setFillColor(233,239,248);doc.rect(M,y,W,22,"F");doc.setDrawColor(...ink);doc.setLineWidth(1.2);doc.line(M,y,M+W,y);
  {let xx=M;const tv=[L.total,"","",fmtInt(x.km)+" km","$"+money(x.park),String(x.rec)],tc=[ink,ink,ink,OUT,MONEY,grey];
   tv.forEach((v,ci)=>{const c=cols[ci];font("bold",10.5,tc[ci]);if(ci===0)doc.text(v,xx+6,y+14.5);else if(v)doc.text(v,xx+c.w-6,y+14.5,{align:"right"});xx+=c.w})}
  y+=22;
  // summary (right half)
  y+=18;const sx=M+W*.40;
  sumLines(x,L).forEach(([l,f,v])=>{font("normal",10);doc.text(l,sx,y);font("bold",10.5,[26,107,74]);doc.text("$"+money(v),M+W,y,{align:"right"});
    if(f){font("normal",8.5,grey);doc.text(f,sx,y+11);y+=25}else y+=16});
  doc.setFillColor(...OUT);doc.roundedRect(sx-8,y-6,M+W-sx+8,28,4,4,"F");
  font("bold",13,[255,255,255]);doc.text(L.due,sx+2,y+12.5);font("bold",15,[255,255,255]);doc.text("$"+money(x.due),M+W-8,y+13,{align:"right"});
  // footer
  try{doc.addImage(BK_LOGO,"PNG",M,758,14,14)}catch(e){}
  font("normal",7.5,grey);doc.text(`${L.dev} Alex Rajabi · Bizkonic · ${now.toISOString().slice(0,10)}`,M+20,768);
  // receipts
  if(withReceipts){
    for(let i=1;i<=daysIn();i++){for(const p of parksOf(state.days[i])){if(!p.photo)continue;
      try{const im=await imgData(blobUrl(p.photo));doc.addPage("letter","portrait");font("bold",12);
        doc.text(`${L.receipt} · ${ym.y}-${pad(ym.m+1)}-${pad(i)} · $${money(toNum(p.amt))}`,M,50);
        const mh=792-2*M-40,sc=Math.min(W/im.w,mh/im.h);doc.addImage(im.data,"JPEG",M,66,im.w*sc,im.h*sc)}catch(e){}}}
  }
  return doc.output("blob");
}
function openPrint(){
  const rtl=lang==="fa",hasPhotos=Object.values(state.days).some(d=>parksOf(d).some(p=>p.photo));
  const h=document.createElement("div");h.className="sheet-bg";
  h.innerHTML=`<div class="sheet" dir="${rtl?"rtl":"ltr"}" lang="${lang}"><h3><span>${t("printTitle")}</span><button class="icon-btn" data-a="close" aria-label="${esc(t("close"))}">×</button></h3>
   <div class="paper-scroll">${previewHtml()}</div>
   ${hasPhotos?`<label class="check"><input type="checkbox" id="pRec" checked><span>${t("includeRec")}</span></label>`:""}
   <div class="note" id="pNote">${t("printHint")}</div>
   <div class="row"><button class="btn primary" data-a="pdf">${t("downloadPdf")}</button></div></div>`;
  h.onclick=async e=>{const a=e.target.dataset.a;
    if(a==="close"||e.target===h)return h.remove();
    if(a!=="pdf")return;
    const note=h.querySelector("#pNote");
    if(!window.jspdf){note.textContent=t("pdfNoLib");return}
    if(!downloads){note.textContent=t("noDownloads");return}
    e.target.disabled=true;note.textContent=t("pdfMaking");
    try{const blob=await buildPdf(!!h.querySelector("#pRec")?.checked);await downloads.save({filename:fileBase()+".pdf",data:blob});note.textContent=t("fileReady")}
    catch(err){note.textContent=err&&err.code==="declined"?t("printHint"):t("pdfFail")+((err&&(err.message||err.code))||"")}
    e.target.disabled=false};
  document.body.appendChild(h);
}

// ---------- CSV / summary ----------
function csv(){
  const s=state.settings,x=totals(),q=v=>`"${String(v??"").replace(/"/g,'""')}"`,L=[];
  if(s.company)L.push([q("Entreprise"),q(s.company)].join(","));
  L.push([q("Nom de l'employé"),q(s.name)].join(","));
  L.push([q("Mois et la Date"),q(`${ym.y}-${pad(ym.m+1)}`)].join(","));
  L.push([q("Fuel Cost (CAD) Price"),q(x.fuel.toFixed(4))].join(","));
  L.push([q("Montant additionnel"+(state.settings.otNote?` (${state.settings.otNote})`:"")),q(money(x.ot))].join(","));L.push("");
  L.push(["Date","Odomètre de départ","Odomètre final","Total des kms (travail)","Parcomètre","Reçus","Note"].map(q).join(","));
  for(let i=1;i<=daysIn();i++){if(!isOpen(i))continue;const d=state.days[i]||{};L.push([`${ym.y}-${pad(ym.m+1)}-${pad(i)}`,d.start||"",d.end||"",kmOf(d)||"",parkOf(d)?money(parkOf(d)):"",parksOf(d).length||"",d.note||""].map(q).join(","))}
  L.push(["TOTAL","","",x.km,money(x.park),x.rec,""].map(q).join(","));L.push("");
  sumLines(x,PT.fr).forEach(([l,,v])=>L.push([q(l),q(money(v))].join(",")));
  L.push([q("MONTANT DÛ"),q(money(x.due))].join(","));
  return "﻿"+L.join("\r\n");
}
function summaryText(){const s=state.settings,x=totals(),k=pl(),L=PT[k];
  return [`${s.company?s.company+" · ":""}${L.title} — ${MONTHS[k][ym.m]} ${ym.y}`,s.name?`${L.emp}: ${s.name}`:null,...sumLines(x,L).map(([l,f,v])=>`${l}: $${money(v)}${f?` (${f})`:""}`),`${L.due}: $${money(x.due)}`].filter(Boolean).join("\n")}
function viewText(txt){const h=document.createElement("div");h.className="sheet-bg";
  h.innerHTML=`<div class="sheet"><div class="note">${t("copyManual")}</div><textarea style="width:100%;min-height:220px;font:13px var(--f-ui);direction:ltr;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px">${esc(txt)}</textarea><button class="btn">${t("close")}</button></div>`;
  h.querySelector("button").onclick=()=>h.remove();document.body.appendChild(h);const ta=h.querySelector("textarea");ta.focus();ta.select()}

// ---------- events ----------
document.querySelector(".langs").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("carlog:lang",lang)}catch(err){}applyLang();showInstall()};
$("days").onclick=e=>{const b=e.target.closest("[data-day]");if(b&&!b.disabled)openDay(+b.dataset.day)};
$("todayBtn").onclick=()=>{const isThis=ym.y===now.getFullYear()&&ym.m===now.getMonth();
  if(isThis){if(isOpen(now.getDate()))return openDay(now.getDate());return toast(t("weekendToast"))}
  for(let i=1;i<=daysIn();i++)if(isOpen(i)&&!state.days[i])return openDay(i);for(let i=1;i<=daysIn();i++)if(isOpen(i))return openDay(i)};
async function flushNow(){clearTimeout(saveTimer);await flush();let n=0;while(saving&&n++<50)await new Promise(r=>setTimeout(r,100))}
$("prev").onclick=async()=>{await flushNow();ym=ym.m===0?{y:ym.y-1,m:11}:{y:ym.y,m:ym.m-1};loadMonth()};
$("next").onclick=async()=>{await flushNow();ym=ym.m===11?{y:ym.y+1,m:0}:{y:ym.y,m:ym.m+1};loadMonth()};
const onSet=e=>{if(!state)return;
  const s=state.settings,el=e.target,map={sCompany:"company",sName:"name",sFuel:"fuel",sOt:"ot",sOtNote:"otNote",sPhone:"phone",sLease:"lease"};
  if(map[el.id])s[map[el.id]]=el.value;else if(el.id==="sWe")s.weekends=el.checked;else if(el.dataset.x!=null)s.extras[+el.dataset.x][el.dataset.f]=el.value;
  scheduleSave();render()};
$("settings").addEventListener("input",onSet);$("monthly").addEventListener("input",onSet);$("details").addEventListener("input",onSet);
$("settings").addEventListener("click",e=>{const d=e.target.closest("[data-delx]");if(d){state.settings.extras.splice(+d.dataset.delx,1);scheduleSave();fillSettings();render()}});
$("clrMonth").onclick=()=>{$("clrQ").textContent=t("clearMonthQ").replace("{m}",`${MONTHS[lang][ym.m]} ${ym.y}`);$("clrConfirm").hidden=false};
$("clrNo").onclick=()=>{$("clrConfirm").hidden=true};
$("clrYes").onclick=()=>{state.days={};state.settings.fuel=null;state.settings.ot=null;state.settings.otNote="";scheduleSave();fillSettings();render();$("clrConfirm").hidden=true;toast(t("monthCleared"))};
$("addExtra").onclick=()=>{state.settings.extras=state.settings.extras||[];state.settings.extras.push({label:"",amt:""});fillSettings();scheduleSave();$("extras").lastElementChild?.querySelector("input")?.focus()};
$("printBtn").onclick=openPrint;
$("copyBtn").onclick=()=>{const txt=summaryText();try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),()=>viewText(txt))}catch(e){viewText(txt)}};
$("csvBtn").onclick=async()=>{if(!downloads)return viewText(csv().slice(1));
  try{await downloads.save({filename:fileBase()+".csv",data:new Blob([csv()],{type:"text/csv;charset=utf-8"})});toast(t("fileReady"))}
  catch(e){if(e&&e.code==="declined")return;viewText(csv().slice(1))}};
window.addEventListener("pagehide",()=>{clearTimeout(saveTimer);flush()});

// ---------- on-device storage ----------
const PHOTO={};
const idb=(()=>{let p;return()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("car-expense",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))})();
async function idbPut(id,blob){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("photos","readwrite");tx.objectStore("photos").put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbAll(){const d=await idb();return new Promise((res,rej)=>{const out={};const rq=d.transaction("photos").objectStore("photos").openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
const localAssets={upload:async blob=>{const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await idbPut(id,blob);PHOTO[id]=URL.createObjectURL(blob);return{id,url:""}}};
const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
async function saveFile({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data]);
  if(mobile&&navigator.canShare){try{const f=new File([blob],filename,{type:blob.type||"application/octet-stream"});
    if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return{status:"saved"}}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return{status:"saved"};
}
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});

// ---------- backup / restore ----------
$("bkBtn").onclick=async()=>{
  await flushNow();
  const months={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("carlog:m-"))try{months[k.slice(7)]=JSON.parse(localStorage.getItem(k))}catch(e){}}
  let defaults=null;try{defaults=JSON.parse(localStorage.getItem("carlog:defaults"))}catch(e){}
  const all=await idbAll().catch(()=>({})),photos={};
  for(const m of Object.values(months))for(const d of Object.values(m.days||{}))for(const p of (d.parks||[]))if(p.photo&&all[p.photo.id]&&!photos[p.photo.id])photos[p.photo.id]=await blobToData(all[p.photo.id]);
  const data=JSON.stringify({app:"car-expense",version:1,saved:new Date().toISOString(),months,defaults,photos});
  try{await saveFile({filename:`Car_Expense_backup_${new Date().toISOString().slice(0,10)}.json`,data:new Blob([data],{type:"application/json"})});toast(t("fileReady"))}catch(e){}
};
$("rsFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const b=JSON.parse(await f.text());if(!b||b.app!=="car-expense"||!b.months)throw 0;
    for(const [k,v] of Object.entries(b.months))localStorage.setItem("carlog:"+k,JSON.stringify(v));
    if(b.defaults)localStorage.setItem("carlog:defaults",JSON.stringify(b.defaults));
    for(const [id,url] of Object.entries(b.photos||{})){const blob=await (await fetch(url)).blob();await idbPut(id,blob);PHOTO[id]=URL.createObjectURL(blob)}
    await loadMonth();toast(t("restored"));
  }catch(err){toast(t("restoreFail"))}};

// ---------- erase everything ----------
$("eraseBtn").onclick=()=>{$("eraseConfirm").hidden=false};
$("eraseNo").onclick=()=>{$("eraseConfirm").hidden=true};
$("eraseYes").onclick=async()=>{
  clearTimeout(saveTimer);dirty=false;
  const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("carlog:")&&k!=="carlog:lang")keys.push(k)}
  keys.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  try{const d=await idb();await new Promise(res=>{const tx=d.transaction("photos","readwrite");tx.objectStore("photos").clear();tx.oncomplete=res;tx.onerror=res})}catch(e){}
  for(const id in PHOTO){try{URL.revokeObjectURL(PHOTO[id])}catch(e){}delete PHOTO[id]}
  $("eraseConfirm").hidden=true;await loadMonth();fillSettings();toast(t("erased"));
};

// ---------- install ----------
let deferredPrompt=null;
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function showInstall(){if(standalone)return;let off=false;try{off=localStorage.getItem("carlog:installHide")==="1"}catch(e){}if(off)return;
  const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  $("installHow").textContent=t(ios?"installIos":"installAndroid");$("installBtn").hidden=!deferredPrompt;$("install").hidden=false}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;showInstall()});
addEventListener("appinstalled",()=>{$("install").hidden=true});
$("installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;$("install").hidden=true};
$("installX").onclick=()=>{$("install").hidden=true;try{localStorage.setItem("carlog:installHide","1")}catch(e){}};

// ---------- boot ----------
state=blank();applyLang();setStatus("loading");showInstall();
(async()=>{
  assets=localAssets;downloads={save:saveFile};mode="local";
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{const all=await idbAll();for(const [id,b] of Object.entries(all))PHOTO[id]=URL.createObjectURL(b)}catch(e){}
  await loadMonth();
})();
if("serviceWorker" in navigator)addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
})();
